metadata:
  description: "Preliminary rib family catalog and warping-knockdown derivation contract."
  catalog_version: 1
  default_family: "balsa_sheet_3mm"
  default_spacing_m: 0.30
  material_sensitivity_families:
    - "balsa_sheet_3mm"
    - "eps_hd_foam_cnc_10mm"
    - "xps_high_compressive_cnc_10mm"
    - "structural_foam_cnc_10mm"
  stiffness_rework_families:
    - "balsa_sheet_3mm"
    - "eps_balsa_cap_hybrid_10mm"
    - "structural_foam_glass_face_10mm"
  future_material_note: "Foam-only EPS/XPS/structural foam remain low-stiffness references; capped/hybrid foam and rear-spar shear-transfer scenarios are separate rework candidates."
  derivation:
    formula: "weighted_material_thickness_proxy_v1"
    reference_family: "balsa_sheet_3mm"
    reference_spacing_m: 0.30
    bending_weight: 0.65
    shear_weight: 0.35
    spacing_exponent: 1.0
    minimum_knockdown: 0.08
    maximum_knockdown: 0.95

families:
  balsa_sheet_3mm:
    label: "Balsa sheet 3 mm"
    material: "balsa"
    thickness_m: 0.003
    family_category: "balsa_baseline"
    description: "Simple sheet-balsa rib bay used as the baseline rib family."
    intended_use: "Legacy-compatible baseline for current dual-spar screening and jig studies."
    notes: "Anchored so nominal spacing reproduces the current conservative-middle assumption of about 0.5 warping knockdown."
    trust_level: "baseline_legacy_screening"
    source_note: "Existing repo baseline: balsa_sheet_3mm at 0.30 m target spacing; keep as the current pathfinder reference, not a final rib drawing."
    stiffness_proxy:
      construction_factor: 1.0
      rotational_fixity_factor: 1.0
      shear_transfer_factor: 1.0
    spacing_guidance:
      min_m: 0.25
      nominal_m: 0.30
      max_m: 0.38

  eps_hd_foam_cnc_10mm:
    label: "CNC-cut high-density EPS foam 10 mm"
    material: "eps_hd_foam"
    thickness_m: 0.010
    family_category: "eps_foam_only"
    description: "Foam-only high-density EPS rib screening family for practical CNC-cut rib comparisons."
    intended_use: "Early shop-realistic foam-only rib sensitivity; no balsa leading edge, glass cap, or carbon cap credit in v1."
    notes: "Low modulus and low rotational fixity are deliberate; do not tune this family to pass aeroelastic twist without added structure."
    trust_level: "low_screening_supplier_coupon_required"
    source_note: "ASTM C578 Type IX / high-density EPS class screening: about 30 kg/m3 density and 25 psi / 0.17 MPa compressive basis; E and shear are conservative proxy values."
    stiffness_proxy:
      construction_factor: 0.70
      rotational_fixity_factor: 0.45
      shear_transfer_factor: 0.45
    spacing_guidance:
      min_m: 0.18
      nominal_m: 0.30
      max_m: 0.30

  xps_high_compressive_cnc_10mm:
    label: "CNC-cut high-compressive XPS foam 10 mm"
    material: "xps_high_compressive_foam"
    thickness_m: 0.010
    family_category: "xps_foam_only"
    description: "Foam-only XPS rib screening family using a higher-compressive insulation/fixture-board class."
    intended_use: "Practical high-compressive foam-only rib comparison where EPS crush margin may be too weak."
    notes: "Still foam-only; no hybrid edge strip or cap credit is included in v1."
    trust_level: "low_screening_supplier_coupon_required"
    source_note: "ASTM C578 Type VI / FOAMULAR 400-like XPS class screening: 40 psi / 0.276 MPa compressive basis; density and modulus are conservative proxy values."
    stiffness_proxy:
      construction_factor: 0.80
      rotational_fixity_factor: 0.50
      shear_transfer_factor: 0.50
    spacing_guidance:
      min_m: 0.18
      nominal_m: 0.30
      max_m: 0.30

  structural_foam_cnc_10mm:
    label: "CNC-cut structural foam 10 mm"
    material: "structural_foam_pvc_h60"
    thickness_m: 0.010
    family_category: "structural_foam_only"
    description: "Foam-only Rohacell/Divinycell-like structural foam rib screening family."
    intended_use: "Higher-stiffness foam-only comparison before adding local balsa/glass/carbon reinforcement in a later hybrid study."
    notes: "Represents a structural core foam rib, not a capped sandwich rib; faces/caps remain future work."
    trust_level: "medium_screening_datasheet_like_supplier_coupon_required"
    source_note: "Divinycell H60 / Rohacell-like screening: about 60 kg/m3 density, 0.9 MPa compressive, and 0.63 MPa shear-strength basis."
    stiffness_proxy:
      construction_factor: 1.00
      rotational_fixity_factor: 0.60
      shear_transfer_factor: 0.75
    spacing_guidance:
      min_m: 0.18
      nominal_m: 0.30
      max_m: 0.30

  eps_balsa_cap_hybrid_10mm:
    label: "EPS foam rib with balsa/cap hybrid 10 mm"
    material: "eps_balsa_cap_hybrid_proxy"
    thickness_m: 0.010
    family_category: "capped_hybrid_foam_rib"
    description: "EPS CNC core rib with balsa edge strips, cap strips, or local gussets carrying rotational fixity."
    intended_use: "Next stiffness-rework candidate when foam-only ribs are too soft but shop workflow still wants CNC foam cores."
    notes: "This is not EPS foam-only credit. Mass and stiffness are effective screening proxies until cap geometry and coupons are supplied."
    trust_level: "rework_candidate_coupon_and_detail_required"
    source_note: "Engineering-screening effective proxy: EPS core plus balsa/cap local reinforcement; keep foam-only EPS as the low-stiffness reference."
    stiffness_proxy:
      construction_factor: 1.10
      rotational_fixity_factor: 1.15
      shear_transfer_factor: 1.20
    spacing_guidance:
      min_m: 0.18
      nominal_m: 0.28
      max_m: 0.32

  structural_foam_glass_face_10mm:
    label: "Structural foam rib with glass faces 10 mm"
    material: "structural_foam_glass_face_proxy"
    thickness_m: 0.010
    family_category: "structural_foam_caps_faces"
    description: "Structural foam rib with thin glass/carbon face sheets or cap strips for torsion/shear transfer."
    intended_use: "Higher-stiffness rework candidate for clearing the current aeroelastic twist blocker before FEM loadcase packaging."
    notes: "Represents capped/faced rib construction, not bare H60 foam. Requires laminate/coupon and rib-spar attachment details."
    trust_level: "rework_candidate_laminate_detail_required"
    source_note: "Effective screening proxy for foam-core rib with face/cap reinforcement; not a final sandwich rib laminate."
    stiffness_proxy:
      construction_factor: 1.05
      rotational_fixity_factor: 1.20
      shear_transfer_factor: 1.25
    spacing_guidance:
      min_m: 0.18
      nominal_m: 0.28
      max_m: 0.32

  foam_core_glass_cap_5mm:
    label: "Foam core with light glass caps 5 mm"
    material: "rohacell_51"
    thickness_m: 0.005
    family_category: "hybrid_future_reference"
    description: "Light sandwich-style rib with foam web and modest cap or face reinforcement."
    intended_use: "Mass-sensitive bays where the rib mainly preserves airfoil shape and transfers moderate torsion."
    notes: "The material key points at the dominant foam core; construction_factor captures the added cap or face-sheet contribution."
    trust_level: "future_hybrid_reference_not_v1_default"
    source_note: "Legacy catalog family retained for compatibility; excluded from v1 foam-only sensitivity defaults because it includes cap/face-sheet credit."
    stiffness_proxy:
      construction_factor: 1.75
      rotational_fixity_factor: 0.70
      shear_transfer_factor: 0.80
    spacing_guidance:
      min_m: 0.18
      nominal_m: 0.24
      max_m: 0.30

  capped_balsa_box_4mm:
    label: "Capped balsa box rib 4 mm"
    material: "balsa"
    thickness_m: 0.004
    family_category: "balsa_hybrid_reference"
    description: "Stiffer built-up balsa rib with caps or gussets for better rotational fixity."
    intended_use: "Higher torsion-retention bays or local reinforcement near joints and wire-attachment regions."
    notes: "Still a screening-level proxy and not a replacement for the future finite-rib mainline mode."
    trust_level: "legacy_hybrid_reference_not_v1_default"
    source_note: "Legacy reinforced balsa reference retained for catalog continuity; excluded from v1 foam-only material family sensitivity defaults."
    stiffness_proxy:
      construction_factor: 1.25
      rotational_fixity_factor: 1.30
      shear_transfer_factor: 1.15
    spacing_guidance:
      min_m: 0.22
      nominal_m: 0.28
      max_m: 0.34
