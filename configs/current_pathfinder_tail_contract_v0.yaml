  - field: reference.mission_cases.slow_or_launch.speed_mps
    reason: No current slow/launch trim case has been promoted.
  - field: reference.mission_cases.yaw_or_turn_correction.beta_deg
    reason: No current yaw/turn correction case has been promoted.
  - field: horizontal_tail.C_Lmax_H_safe
    reason: No current tail polar / safe CLmax artifact exists for the discrete candidates.
  - field: horizontal_tail.downwash_epsilon_W_alpha
    reason: No current downwash model tied to the pathfinder wing exists.
  - field: horizontal_tail.C_m_WB
    reason: No current wing-body pitching moment contract exists for full-aircraft trim.
  - field: horizontal_tail.C_m_deltaH_all_moving
    reason: No all-moving H-tail geometry sweep / AVL derivative exists.
  - field: vertical_tail.C_Ymax_V_safe
    reason: No current vertical-tail sideforce polar / safe CYmax artifact exists.
  - field: vertical_tail.C_n_beta
    reason: No current full-aircraft directional stability derivative exists.
  - field: vertical_tail.C_n_deltaV_all_moving
    reason: No all-moving V-tail geometry sweep / AVL derivative exists.
  - field: vertical_tail.yaw_roll_coupling_limit
    reason: No current yaw-roll coupling limit or warning threshold has been promoted.
  - field: mission_budget_placeholders.tail_drag.model
    reason: Tail drag is not yet charged to candidate power / drag budget.
  - field: mission_budget_placeholders.tail_mass.model
    reason: Tail mass and hardware are not yet charged to mass / CG budget.
