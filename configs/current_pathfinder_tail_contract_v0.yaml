mission_budget_placeholders:
  tail_drag:
    status: placeholder_not_charged_to_current_candidate_power
    budget_entry: >-
      Add tail CD0/profile drag and induced trim drag as deltas to
      candidate CD0_total / CD_total, then recompute P_crank and
      P_crank_conservative for each trimmed case.
    required_next_input: tail airfoil polar / AVL all-moving sweep / tail q-ratio.
  tail_mass:
    status: placeholder_not_charged_to_current_structural_mass_or_cg
    budget_entry: >-
      Add H-tail, V-tail, pivot, bearing, linkage, and tailboom increments to
      total aircraft mass; update CG range before re-solving trim.
    required_next_input: tail mass model, tailboom layout, pivot hardware allowance.

equations:
  horizontal_tail:
    tail_volume: V_H = S_H * l_H / (S_W * cbar_W)
    effective_alpha: alpha_H = alpha + i_H0 + delta_H + theta_tailboom - epsilon_W(alpha) - alpha0_H
    trim_lift: L_W + L_H = W
    trim_moment: C_m = C_m_WB + C_L_W * (x_cg - x_ac_W) / cbar_W - eta_H * (S_H / S_W) * (l_H / cbar_W) * C_L_H
    deflection_reserve: delta_H_min + reserve <= delta_H_trim <= delta_H_max - reserve
    utilization: abs(C_L_H / C_Lmax_H_safe) <= eta_H_tail
    pivot_moment: C_m_p_H ~= C_m_ac_H + C_L_H * ((x_ac_H - x_p_H) / cbar_H)
  vertical_tail:
    tail_volume: V_V = S_V * l_V / (S_W * b_W)
    effective_beta: beta_V = beta + i_V0 + delta_V + psi_tailboom - sigma_W(beta)
    directional_stability: C_n_beta > C_n_beta_min
    yaw_trim: exists delta_V such that C_n(beta, delta_V) = 0
    deflection_reserve: delta_V_min + reserve <= delta_V_required <= delta_V_max - reserve
    utilization: abs(C_Y_V / C_Ymax_V_safe) <= eta_V_tail
    yaw_roll_coupling_warning: C_l_V ~ Y_V * z_V / (q * S_W * b_W)

